services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: bafafa
      POSTGRES_USER: bafafa
      POSTGRES_PASSWORD: bafafa
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  mongo:
    image: mongo:8
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  postgres-data:
  mongo-data: