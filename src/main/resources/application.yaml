spring:
  data:
    mongodb:
      database: bafafa
      auto-index-creation: true
  modulith:
    events:
      republish-outstading-events-on-restart: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  application:
    name: bafafa
bafafa:
  auth:
    jwt-secret: ${JWT_SECRET:dev-only-secret-troque-em-producao-0123456789}
    access-token-ttl: 15m
    refresh-token-ttl: 30d
    refresh-cookie-secure: false
    rate-limit:
      register-per-ip:   { capacity: 5,  period: 1h }
      login-per-ip:      { capacity: 20, period: 1m }
      login-per-account: { capacity: 5,  period: 1m }
  post:
    cache:
      ttl: 10m